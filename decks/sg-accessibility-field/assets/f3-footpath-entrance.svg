<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-label="Plan of a plaza and a footpath. Three bollards P1, P2 and P3 stand in a row along the plaza edge, at 0 m, 1.5 m and 3.0 m from the line where the footpath starts." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#12151e"/>
    </marker>
    <style>
      .paper { fill: #f4f6fb; }
      .plaza { fill: #cfd7e6; stroke: #0d1018; stroke-width: 2.8; }
      .path { fill: #b7c2d6; stroke: #0d1018; stroke-width: 2.8; }
      .start { stroke: #1a4fa0; stroke-width: 5; stroke-dasharray: 9 5; fill: none; }
      .boll { fill: #0d1018; }
      .ext { stroke: #12151e; stroke-width: 1.1; fill: none; }
      .dim { stroke: #12151e; stroke-width: 1.3; fill: none; marker-start: url(#arr-plan); marker-end: url(#arr-plan); }
      .lbl { fill: #12151e; font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; }
      .zone { fill: #2a3344; font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; }
      .caption { fill: #12151e; font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; }
      .lbl-sub { fill: #3d4558; font: 600 19px system-ui, -apple-system, Segoe UI, sans-serif; }
      .badge { fill: #ffffff; stroke: #12151e; stroke-width: 1.5; }
      .sep { stroke: #c5ccd8; stroke-width: 1; }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="680" height="420" rx="12"/>

  <!-- Plaza 4 m x 4 m (50 px per m) and footpath 1.5 m wide -->
  <rect class="plaza" x="120" y="40" width="200" height="200" rx="4"/>
  <rect class="path" x="320" y="40" width="280" height="76" rx="4"/>
  <line class="start" x1="320" y1="34" x2="320" y2="122"/>

  <text class="zone" x="128" y="270">paved plaza</text>
  <text class="zone" x="334" y="148">footpath</text>

  <!-- Bollards P1 (on the line), P2 (1.5 m), P3 (3.0 m) -->
  <circle class="boll" cx="320" cy="56" r="11"/>
  <circle class="boll" cx="245" cy="56" r="11"/>
  <circle class="boll" cx="170" cy="56" r="11"/>

  <rect class="badge" x="294" y="2" width="52" height="34" rx="6"/>
  <text class="lbl" x="304" y="28">P1</text>
  <rect class="badge" x="219" y="2" width="52" height="34" rx="6"/>
  <text class="lbl" x="229" y="28">P2</text>
  <rect class="badge" x="144" y="2" width="52" height="34" rx="6"/>
  <text class="lbl" x="154" y="28">P3</text>

  <!-- Distances measured from the line where the footpath starts -->
  <line class="ext" x1="245" y1="67" x2="245" y2="176"/>
  <line class="ext" x1="170" y1="67" x2="170" y2="206"/>
  <line class="ext" x1="320" y1="116" x2="320" y2="206"/>
  <line class="dim" x1="320" y1="168" x2="245" y2="168"/>
  <text class="lbl" style="font-size:20px" x="253" y="161">1.5 m</text>
  <line class="dim" x1="320" y1="198" x2="170" y2="198"/>
  <text class="lbl" style="font-size:20px" x="176" y="191">3.0 m</text>

  <line class="sep" x1="24" y1="320" x2="656" y2="320"/>

  <line class="start" x1="32" y1="348" x2="80" y2="348"/>
  <text class="caption" x="92" y="356">footpath starts here</text>
  <circle class="boll" cx="400" cy="348" r="10"/>
  <text class="caption" x="420" y="356">bollard, 900 mm high</text>

  <text class="lbl-sub" x="32" y="396">Plan view. Distances from the line where the footpath starts.</text>
</svg>
