<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="Side view of two stair flights; handrail height measured vertically from pitch line to handrail top">
  <defs>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#c62828"/>
    </marker>
    <marker id="arr-bad-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 Z" fill="#c62828"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#12151e"/>
    </marker>
    <marker id="arr-ok-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 Z" fill="#12151e"/>
    </marker>
    <style>
      .paper { fill: #f4f6fb; }
      .tread-fill { fill: #c5cddc; }
      .tread { fill: none; stroke: #0d1018; stroke-width: 3.2; stroke-linejoin: round; stroke-linecap: square; }
      .pitch { fill: none; stroke: #2a3344; stroke-width: 2.4; stroke-dasharray: 8 5; stroke-linecap: round; }
      .rail-bad { fill: none; stroke: #c62828; stroke-width: 5; stroke-linecap: round; }
      .rail-ok { fill: none; stroke: #0d1018; stroke-width: 5; stroke-linecap: round; }
      .ext-bad { stroke: #c62828; stroke-width: 1.15; fill: none; }
      .ext-ok { stroke: #12151e; stroke-width: 1.15; fill: none; }
      .dim-bad { stroke: #c62828; stroke-width: 1.35; fill: none; }
      .dim-ok { stroke: #12151e; stroke-width: 1.35; fill: none; }
      .pt-bad { fill: #c62828; stroke: #fff; stroke-width: 1.5; }
      .pt-ok { fill: #12151e; stroke: #fff; stroke-width: 1.5; }
      .nosing { fill: #2a3344; }
      .lbl-bad { fill: #c62828; font: 700 17px system-ui, -apple-system, Segoe UI, sans-serif; }
      .lbl-ok { fill: #12151e; font: 700 17px system-ui, -apple-system, Segoe UI, sans-serif; }
      .lbl-sub { fill: #3d4558; font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; }
      .note { fill: #3d4558; font: 600 13px system-ui, -apple-system, Segoe UI, sans-serif; }
      .caption { fill: #12151e; font: 700 14px system-ui, -apple-system, Segoe UI, sans-serif; }
      .badge { fill: #ffffff; stroke-width: 1.6; }
      .sep { stroke: #c5ccd8; stroke-width: 1; }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="700" height="470" rx="12"/>

  <path class="tread-fill" d="
    M 40,368
    H 64 V 340 H 104 V 312 H 144 V 284 H 184 V 256
    H 300 V 228 H 340 V 200 H 380 V 172 H 420 V 144 H 530
    V 368 Z"/>
  <path class="tread" d="
    M 40,368 H 64
    V 340 H 104
    V 312 H 144
    V 284 H 184
    V 256 H 300
    V 228 H 340
    V 200 H 380
    V 172 H 420
    V 144 H 530"/>

  <!-- Pitch through nosings — starts at upper edge of first tread (64,340), not at floor -->
  <line class="pitch" x1="64" y1="340" x2="184" y2="256"/>
  <line class="pitch" x1="300" y1="228" x2="420" y2="144"/>
  <circle class="nosing" cx="64" cy="340" r="3"/>
  <circle class="nosing" cx="104" cy="312" r="3"/>
  <circle class="nosing" cx="144" cy="284" r="3"/>
  <circle class="nosing" cx="184" cy="256" r="3"/>
  <circle class="nosing" cx="300" cy="228" r="3"/>
  <circle class="nosing" cx="340" cy="200" r="3"/>
  <circle class="nosing" cx="380" cy="172" r="3"/>
  <circle class="nosing" cx="420" cy="144" r="3"/>

  <line class="rail-bad" x1="64" y1="276" x2="184" y2="192"/>
  <line class="rail-ok" x1="300" y1="146" x2="420" y2="62"/>

  <!-- DIM 700 at 2nd nosing (104,312) — exact pitch point; rail at 248 -->
  <circle class="pt-bad" cx="104" cy="312" r="4.5"/>
  <circle class="pt-bad" cx="104" cy="248" r="4.5"/>
  <line class="ext-bad" x1="108" y1="312" x2="230" y2="312"/>
  <line class="ext-bad" x1="108" y1="248" x2="230" y2="248"/>
  <line class="dim-bad" x1="222" y1="312" x2="222" y2="248" marker-start="url(#arr-bad-rev)" marker-end="url(#arr-bad)"/>
  <rect class="badge" x="234" y="262" width="136" height="38" rx="6" stroke="#c62828"/>
  <text class="lbl-bad" x="244" y="280">700 mm</text>
  <text class="lbl-sub" x="244" y="295">pitch line → handrail</text>

  <!-- DIM 900 at 2nd nosing of flight 2 (340,200); rail at 118 -->
  <circle class="pt-ok" cx="340" cy="200" r="4.5"/>
  <circle class="pt-ok" cx="340" cy="118" r="4.5"/>
  <line class="ext-ok" x1="344" y1="200" x2="466" y2="200"/>
  <line class="ext-ok" x1="344" y1="118" x2="466" y2="118"/>
  <line class="dim-ok" x1="458" y1="200" x2="458" y2="118" marker-start="url(#arr-ok-rev)" marker-end="url(#arr-ok)"/>
  <rect class="badge" x="470" y="140" width="136" height="38" rx="6" stroke="#12151e"/>
  <text class="lbl-ok" x="480" y="158">900 mm</text>
  <text class="lbl-sub" x="480" y="173">pitch line → handrail</text>

  <text class="note" x="210" y="274">landing</text>

  <line class="sep" x1="24" y1="390" x2="676" y2="390"/>
  <line class="pitch" x1="40" y1="412" x2="88" y2="412"/>
  <text class="note" x="98" y="417">pitch line (through nosings)</text>
  <circle class="pt-bad" cx="40" cy="440" r="3.5"/>
  <text class="note" x="52" y="444">points on pitch line &amp; handrail</text>
  <line class="rail-bad" x1="260" y1="440" x2="300" y2="440"/>
  <text class="caption" x="310" y="444">Flight 1</text>
  <line class="rail-ok" x1="400" y1="440" x2="440" y2="440"/>
  <text class="caption" x="450" y="444">Flight 2</text>
</svg>
